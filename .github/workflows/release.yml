# Cut a devkit release.
#
# Deliberately `workflow_dispatch` and not "tag every merge to main". The release
# ordering in RELEASING.md steps 3-5 requires FALLBACK_DEVKIT_REF to be bumped and
# committed *before* the tag exists; a merge commit gives no opportunity to do that
# first, so auto-tagging on merge would leave
# `test_fallback_devkit_ref_tracks_the_newest_tag` permanently red and every project
# generated afterwards pinning a stale ref.
#
# Releasing promptly matters more than it used to: `sync-devkit.py --pull` refuses to
# vendor from an untagged devkit, because a consumer can only pin a tag. Untagged work
# on main is work no project can adopt.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to cut, e.g. v0.5.3 (must not already exist)"
        required: true
        type: string
      phase:
        description: "prepare = bump + open the PR; tag = tag main after that PR merges"
        required: true
        default: prepare
        type: choice
        options: [prepare, tag]

# `contents: write` pushes the release branch and the tag. There is deliberately no
# `pull-requests: write`: this workflow never opens the release PR itself, because a
# PR opened with GITHUB_TOKEN triggers no workflow run and so arrives with no PR Gate
# — see the prepare step.
permissions:
  contents: write

# One release run at a time, and never cancelled. Both halves matter, and neither was
# here until `test_ci_workflow_contract.py` asked for the block:
#
#   * Serializing is the point. Two dispatches in flight — a double-clicked `prepare`,
#     or a `tag` started while a `prepare` is still pushing — race on the same branch
#     and the same tag. The loser fails somewhere after it has already committed and
#     pushed, which is the one state RELEASING.md's ordering exists to avoid.
#   * `cancel-in-progress: false` because a superseded release run is not a wasted PR
#     run. It is mid-way through pushing a branch, opening a PR, or publishing a tag,
#     and killing it there leaves exactly the half-applied release nothing cleans up.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: release.py refuses a version that already exists, and
      # a shallow clone would hide every existing tag from that check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # The repo's own provisioning action, not a bare `setup-python`: it installs uv
      # and syncs from the committed lock, which is what puts pytest, ruff and mypy on
      # the path at all. Every tool below therefore runs through `uv run`, since the
      # sync lands in `.venv` rather than in the runner's interpreter.
      - uses: ./.github/actions/setup-python-env

      - name: Show what this phase would do
        run: uv run python scripts/release.py "${{ inputs.version }}" ${{ inputs.phase == 'tag' && '--tag' || '' }}

      # Phase 2 needs the candidate tag to exist locally before the suite runs:
      # `test_fallback_devkit_ref_tracks_the_newest_tag` compares the committed
      # fallback with `git describe --tags`. Keep it local until every gate passes,
      # so a red commit can never acquire a published release tag.
      - name: Stage the release tag locally
        if: inputs.phase == 'tag'
        run: git tag "${{ inputs.version }}" origin/main

      # The gate. A tag is what every consumer pins, so it must never name a commit
      # whose suite was red — that is the "one bad commit reddens every consumer"
      # failure, published.
      - name: Full suite
        run: |
          uv run python -m pytest -q
          uv run python -m pytest scripts/hooks/tests/ -q

      - name: Lint
        run: uv run python scripts/lint-all.py

      # Phase 1 pushes a branch and opens a PR. It does NOT push to main: devkit's
      # own pre-push policy protects that branch, and a workflow that ignored it
      # would be asserting a rule the humans are held to does not apply to CI.
      #
      # The PR itself is deliberately NOT opened here. A PR opened with
      # GITHUB_TOKEN triggers no workflow run, so it arrives with no PR Gate at
      # all — and RELEASING.md step 4 requires reading that gate's uploaded
      # test-failures.log before merging. This step used to attempt
      # `gh pr create` anyway, assuming "Allow GitHub Actions to create and
      # approve pull requests" would be off and the call would 403 into the
      # manual path. The v0.9.0 release disproved it: the setting was on, the
      # call succeeded, and the release PR sat with no checks until a human
      # closed and reopened it to get a real-actor `pull_request` event. So the
      # manual path is the only path: the bump is committed and the branch
      # pushed, and the one remaining command goes in the step summary, to be
      # run by the operator whose PR will actually carry a gate.
      - name: Prepare the release PR
        if: inputs.phase == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python scripts/release.py "$VERSION" --yes

          cat > /tmp/release-pr-body.md <<EOF
          Bumps FALLBACK_DEVKIT_REF to $VERSION (RELEASING.md step 3).

          Merge this, then re-run the release workflow with phase=tag to cut the tag
          on main. The tag is deliberately not created until the bump has landed:
          tagging first leaves main with a newer tag than its own constant.

          ## Expect exactly one red test

          \`test_fallback_devkit_ref_tracks_the_newest_tag\` will fail here — it compares
          the constant against \`git describe --tags\`, and $VERSION does not exist yet.
          That is the check working (RELEASING.md step 4). Nothing else may be red:
          read the uploaded test-failures.log and confirm before merging.
          EOF

          echo "::notice::The branch is pushed; open its PR with the command in the summary."
          {
            echo "### release/$VERSION is pushed — open its PR"
            echo
            echo "The workflow does not open the PR itself: a PR opened with"
            echo "GITHUB_TOKEN carries no PR Gate, and step 4 of RELEASING.md is"
            echo "reading that gate's test-failures.log. The bump is already"
            echo "committed and pushed, so only this step is left:"
            echo
            echo '```bash'
            echo "gh pr create --repo $REPO --base main --head release/$VERSION \\"
            echo "  --title 'Release $VERSION' --body-file - <<'BODY'"
            cat /tmp/release-pr-body.md
            echo "BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The dry run above validated that the tag is new and the fallback bump is on
      # origin/main. The suite then validated that exact locally-tagged commit. Only
      # now make the already-verified tag visible to consumers.
      - name: Publish the release tag
        if: inputs.phase == 'tag'
        run: git push origin "${{ inputs.version }}"

      # Proves the tag serves what it claims, per RELEASING.md's acceptance test: the
      # published pre-commit hooks must be IN the tagged tree. A tag that cannot serve
      # its hook ids aborts the next consumer's commit with "hook not found".
      - name: The tag carries the published hook channel
        if: inputs.phase == 'tag'
        run: |
          git ls-tree -r --name-only "${{ inputs.version }}" \
            | grep -E '(pre-commit-hooks\.yaml|precommit/)' \
            || { echo "::error::${{ inputs.version }} does not carry the published hooks"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### devkit ${{ inputs.version }} released"
            echo
            echo "Adopt it in a consumer with the **Devkit: Upgrade a Project** task,"
            echo "which moves the vendored files, \`DEVKIT_VERSION\`, the pre-commit"
            echo "\`rev:\` and the PR-gate \`ref:\` together."
          } >> "$GITHUB_STEP_SUMMARY"
