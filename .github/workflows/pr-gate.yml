name: PR Gate

# Test devkit in isolation: lint, the vendored hook-script tests, and devkit's own
# tests (the project generator, the port registry, the template renderer). Everything
# is stdlib-only, so no services or project scaffold are needed.
#
# The title is `PR Gate`, not `CI`, and the file is at the path every consumer's gate
# lives at (`sync-devkit.py`'s `PR_GATE_FILE`). Both are load-bearing now that
# `dependabot-automerge.yml` is vendored: that file waits on a workflow *by title*, so
# a title only devkit used would make the merge job inert in devkit alone — silently,
# because an unmatched `workflow_run` produces no run to go red.
#
# The two test trees are deliberately separate. `scripts/hooks/tests/` ships into
# every consuming project via sync-devkit.py's MANIFEST and must stay project-
# agnostic — it runs against whatever `.devkit.toml` it finds, so it may never
# assert one project's literal values. `tests/` is devkit-only and never vendored,
# which is what lets the generator grow without forcing a `--pull` in every consumer.
#
# A PR runs it only when the PR waits for a gate before it merges: every job carries the
# same `if:`, `sync-devkit.PR_GATE_RUNS_IF`, which is true off `pull_request` and, on it,
# for a bot's PR, a fork's, a `release/` branch, one labelled `automerge` (Dependabot, a
# money PR `land.py` routes there, an upgrade) or `hold`, or one whose body says
# `Hold: yes`. Every other PR of a direct project merges as it opens and is checked by the
# run on the default branch after it, so a run on the PR is the same work twice. A run
# whose jobs all skip concludes `skipped`, which `gate_passed` never reads as a pass.
# `labeled`, because `land.py` applies `automerge` after opening, and that label is what
# turns this gate on for the PR. The queue labels an unlabelled money PR and dispatches the
# gate on its branch (`merge-dependabot-prs.request_gate`).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Re-runnable by hand. Cheap to have, and the only way to re-gate a commit
  # whose run was cancelled by the concurrency rule below.
  workflow_dispatch:

# Least privilege. Every job here only reads the repo; the one workflow that needs
# more (dependabot-automerge.yml) declares it in its own file rather than relying on
# a permissive repo default reaching this one.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight run for that ref. Keyed on the ref, not
# the workflow alone, so a PR run (refs/pull/N/merge) and a main-branch run
# (refs/heads/main) never cancel each other.
#
# `cancel-in-progress` is deliberately conditional: cancelling a superseded PR run
# saves minutes on a commit nobody will merge, but cancelling a push-to-main run
# would throw away the only CI signal that commit will ever get — and the Dependabot
# merge job gates on `workflow_run.conclusion == 'success'`, which a cancelled run
# never reports.
#
# A default-branch run is keyed on its commit. GitHub keeps one pending run per group, so
# with the ref as the key a burst of merges kept only the newest, and the commits between
# never got the verdict that says which of them broke the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Lint + hook-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1: `latest_devkit_tag()` shells out
          # to `git describe --tags`, which needs the tags *and* a history that
          # reaches them. Shallow, it returns None and the generator silently falls
          # back to FALLBACK_DEVKIT_REF — the exact staleness the tag tests exist to
          # catch, invisible on a runner that cannot see a tag at all.
          fetch-depth: 0
          # A release PR is judged as its own head -- `green` plus the bump, the exact
          # commit `release.yml` will tag -- not as GitHub's merge with main, which
          # carries whatever main's tip is red on and would hold every release behind
          # it. Every job below says the same; every other PR keeps the merge ref.
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      - uses: ./.github/actions/setup-python-env
        # Every check after the first runs once this has, whatever the check before it
        # said: a red lint here once hid both test tiers, so main's log named 2 of its 4
        # reds and the other two surfaced a gate cycle later (ledger f872ef7c).
        id: env
        with:
          # Explicit, the same way every generated gate passes it: the action is
          # copied verbatim rather than rendered, so its own default cannot know a
          # project's version. devkit's happens to match it, which is why relying on
          # the default here would leave the convention untested in the one repo
          # that ships it.
          python-version: "3.12"
      - name: Format
        # FIRST, and before anything that can rewrite a file: `lint-all.py` auto-fixes
        # by design, so running it earlier would repair drift and then report clean,
        # turning this gate into a no-op.
        #
        # MANIFEST files are vendored byte-identical, and every adopter runs
        # `ruff format` at commit time or in its lint job. An unformatted
        # file here is therefore rewritten downstream on first touch, and the
        # adopter's `sync-devkit.py --check` then reports drift it did not cause
        # — which is exactly how v0.4.0 shipped a 101-char line in
        # harness_config.py and broke Carameli's mirror-sync gate. `ruff check`
        # cannot catch it: `scripts/**` ignores E501 by design.
        run: uv run ruff format --check .
      - name: Lint
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        run: uv run ruff check .
      - name: Lint under the ruff consumers pin
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        # A consumer lints the vendored files with the ruff-pre-commit rev its project
        # was generated with, not with devkit's ruff. 0.17 accepts a frozen dataclass
        # in a default that 0.16 refuses (B008), so v0.11.100 was green here and red in
        # seven adoption PRs. `tests/test_gate_parity.py` holds this to the template's rev.
        run: uvx ruff@0.16.0 check .
      - name: Lint + typecheck via the wrapper devkit ships
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        # Runs devkit's own `scripts/lint-all.py` — the entrypoint the pre-push gate
        # and every generated PR gate invoke. Its unique contribution over the two
        # steps above is mypy; running it here also means the wrapper itself is
        # exercised on every push rather than only in whichever session last touched
        # it. The workflow files are actionlint's, in the pre-commit job below.
        run: uv run python scripts/lint-all.py
      - name: Upload lint artifact
        # The filtered artifact, not the raw job log: a raw log buries the real error
        # under container-boot noise and wastes an agent's context.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-errors
          path: logs/lint-errors.log
      - name: devkit tests (generator, and a third of the rest)
        # Also after a red lint: skipped, this tier's failures reached the fix pass one
        # gate cycle late (ledgers f07541c7, f872ef7c).
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        # Via the wrapper, for the same dogfooding reason as the lint step: this is
        # what `run-tests.py` is for, and a broken wrapper should fail devkit's own CI
        # rather than surface first in a generated project.
        #
        # A third of the suite, with `suite` below running the other two: serially the
        # tiers took eight minutes, which is how long a red main went unread. This job
        # keeps its name, its artifact and `test_new_project.py` whatever is moved, because
        # `release-pipeline.py` reads a release commit's one expected red from them
        # (`GATE_TEST_JOB`, `EXPECTED_RED_TEST`).
        #
        # Split by position, not by time, and that is enough while no file dominates: one
        # did, a test sleeping 549s on a freshly booted runner (`tests/machine_clock_plugin.py`),
        # and with it gone each third finishes inside the generated-project jobs, which set
        # the verdict. The junit file is how the next imbalance is found: `run-tests.py`
        # prints nothing of a passing run, so `--durations` never reaches the log.
        run: printf '%s\n' tests/test_*.py | awk '$0 == "tests/test_new_project.py" || NR % 3 == 0' | xargs uv run python scripts/run-tests.py --only --junit-xml=logs/junit-tests.xml
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures
          path: logs/test-failures.log
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-0
          path: logs/junit-tests.xml
          if-no-files-found: ignore

  suite:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: devkit tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard's red says nothing about the other's, and both belong in one verdict.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: devkit tests (the rest of the suite)
        run: printf '%s\n' tests/test_*.py | awk '$0 != "tests/test_new_project.py" && NR % 3 == ${{ matrix.shard }}' | xargs uv run python scripts/run-tests.py --only --junit-xml=logs/junit-tests.xml
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.shard }}
          path: logs/test-failures.log
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.shard }}
          path: logs/junit-tests.xml
          if-no-files-found: ignore

  hook-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Hook-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: Hook-script tests
        # A junit file, because this step never reaches `run-tests.py`, which writes
        # `logs/test-failures.log`: without it a red vendored suite uploads nothing the
        # fix pass can read, and its failing ids come out of `gh run view --log-failed`.
        run: uv run python -m pytest scripts/hooks/tests/ -q --junit-xml=logs/junit-hooks.xml
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-hooks
          path: logs/junit-hooks.xml

  pre-commit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: Pre-commit gate (the channel devkit publishes)
    runs-on: ubuntu-latest
    # Its own job: it clones pinned third-party hook repos and builds their isolated
    # environments, so it has a different failure mode (and a different cache) from the
    # lint job — and a network hiccup there should not read as a lint failure.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: Run every hook over the whole repo
        # `--all-files`, not the staged diff: on a push there is no staged diff, and the
        # devkit-authored hooks (manifest validity, stdlib-only imports) are cheap enough
        # to run repo-wide every time.
        #
        # This is what keeps the published channel honest. `.pre-commit-hooks.yaml` is
        # consumed by *other* repos at a pinned rev, so a hook that is broken here is
        # broken for them at their next `autoupdate` — and nothing else in this repo would
        # execute these scripts the way pre-commit does (`language: script`, which needs
        # the executable bit and a working shebang).
        #
        # The commit stage only. The pre-push stage is the three commands the test job
        # above already runs directly; running them a second time here would double
        # the gate's cost for no second signal.
        run: uv run pre-commit run --all-files --show-diff-on-failure

  generated-project:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: A generated project is green on arrival (${{ matrix.presets }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two halves, not one job each: the account runs a fixed number of jobs at once,
        # across every repository.
        presets: ["bare service service-redis data", "fullstack desktop desktop-static desktop-web"]
    # The regression this exists for: the vendored hook tests once pinned carameli's
    # literal credentials and paths, so every generated project failed 12 of them on
    # its very first CI run. Rendering a project and running its suites here is the
    # only check that catches that class of coupling — devkit's own suite passes
    # precisely because devkit's manifest is the one being hard-coded against.
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the other job, and one more: the generator compares the
          # vendored harness against the pinned tag, which it can only do with the
          # tagged commits present. Shallow, that check degrades to a printed note.
          fetch-depth: 0
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      # Deliberately NOT `./.github/actions/setup-python-env`: that action syncs
      # devkit's own environment, and this job never runs devkit's suite. It needs the
      # bare tools on PATH so the *generated* projects can be linted and tested inside
      # their own trees. uv is here so the generator can produce each project's
      # uv.lock — it degrades to a warning without uv, so this keeps the lock path
      # itself under test rather than silently skipped.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff pytest uv mypy
      - name: Configure git identity
        # The generator makes an initial commit; a bare runner has no identity, and
        # `git commit` fails with "Please tell me who you are" rather than anything
        # that points at the generator.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "devkit CI"
      - name: Generate a project of each shape and run its checks
        run: |
          set -euo pipefail
          for preset in ${{ matrix.presets }}; do
            name="probe_$(echo "$preset" | tr '-' '_')"
            echo "::group::$preset"
            rm -rf /tmp/gen && mkdir -p /tmp/gen
            python scripts/new-project.py "$name" \
              --preset "$preset" --parent /tmp/gen --no-remote --yes
            cd "/tmp/gen/$name"
            python -m pytest scripts/hooks/tests/ -q
            # The wrappers tasks.json and the generated PR gate actually invoke.
            # Running pytest/ruff directly misses how these call them.
            python scripts/run-tests.py
            # BEFORE lint-all.py, which auto-fixes: a generated project must arrive
            # format-clean, or its ruff-format pre-commit hook rewrites files on the
            # owner's first run. devkit excludes templates/ from its own format check, so
            # this is the only place that drift can surface.
            ruff format --check .
            python scripts/lint-all.py
            ruff check .
            DEVKIT_DIR="$GITHUB_WORKSPACE" python scripts/sync-devkit.py --check
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  upgrade-rehearsal:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'automerge') || contains(github.event.pull_request.labels.*.name, 'hold') || contains(github.event.pull_request.body, format('hold:{0}yes', ' ')) }}
    name: A project on the previous release survives adopting this one
    runs-on: ubuntu-latest
    # The regression this exists for: v0.11.21 widened a vendored gate
    # (`test_untested_symbols` began demanding a test for `scripts/lint-all.py::main`,
    # a project-owned file no template test covers), devkit's own gate passed because
    # devkit has that test, and `generated-project` above passed because a FRESH render
    # seeds its baseline. Only a project that already existed failed -- and every
    # consumer is one. The adoption PR went red in eight repos, and each cost an agent
    # session to rediscover one cause. Nothing here rehearsed an upgrade.
    #
    # So: render a project with the PREVIOUS release's generator, pull this PR's tree
    # into it the way `upgrade-project.py` does in every consumer, and run the gate the
    # consumer's own PR would run. It cannot catch a project-specific breakage, but the
    # class above -- a vendored change that assumes something a fresh render has and an
    # upgraded project does not -- is exactly what it catches, before the fan-out.
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the previous release is found by tag, and the
          # generator at that tag pins the newest tag it can see.
          fetch-depth: 0
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff pytest uv mypy
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "devkit CI"
      - name: Render a project at the previous release, then pull this tree into it
        # The recipe is `scripts/rehearse-upgrade.py`, whose docstring has it step by
        # step: one copy, so a session can run on its workstation exactly what this job
        # runs, and learn before a gate cycle what #424 learned from one (85c4fb7f).
        run: python scripts/rehearse-upgrade.py
