name: Auto-merge

# Merges any PR labelled `automerge` once the PR Gate has passed on its current
# head. The label is the authorization: only someone with write access can apply
# it, so labelling a PR *is* the review decision, made once, instead of a merge
# click that waits on a human after the gate has already said everything a human
# would check. Every Dependabot PR is labelled automatically by the classify job,
# majors and runtime dependencies included. These projects are written by agents, so
# nobody holds a judgement of whether a major breaks the code that a passing gate does
# not already express: a hold label (`needs-manual-merge`, until 2026-11-02) only
# stranded green bumps until someone merged them with nothing to add.
# That holds only for what the gate runs. A compose image it never starts is the
# exception, and it is held at the source, not here: `dependabot.yml` ignores that
# ecosystem's majors, and `test_ci_workflow_contract.py` fails a project that does not.
# Every other PR no person prompted for carries the label from creation too -- the
# fix pass's fixer PRs, `upgrade-project.py`'s upgrade PRs, the Codex sync -- and a
# human can apply it to any PR instead of babysitting the gate.
#
# These repos have no branch protection, so GitHub's native auto-merge (which gates on
# *required* checks) is unavailable. The work is split in two instead:
#
#   1. classify runs on Dependabot's PRs and labels them.
#   2. merge runs when the PR Gate completes and merges only if the gate succeeded
#      on the PR's CURRENT head and the PR carries the `automerge` label.
#
# Both halves are needed because a `pull_request` job cannot wait for another
# workflow, and a `workflow_run` job does not know who opened the PR -- the
# `pull_request` event's actor is what makes the label Dependabot's to receive.
#
# If a labelled PR fails the gate, nothing happens: the PR simply stays open with
# its `automerge` label, and the next push's gate run owns the retry.
#
# Three things hang off the same file because they all start from a merge or a gate:
#
#   3. sweep also drains `merge-now` PRs, the direct flow's: no gate, oldest first, one
#      at a time per repository, because its job-level group lets one run at once. A
#      queued run replacing another queued run loses nothing, since each drains them all.
#   4. tidy runs after a drain in the direct flow, then starts the gate, so the gate
#      judges the tidied tree. Merging does not wait for it: it has its own group.
#   5. green fast-forwards the `green` branch whenever the gate passes on a commit of the
#      default branch. A merge made here raises no `push`, so `merge-dependabot-prs.py`
#      dispatches the gate itself, and that dispatch is what reaches this job.
#
# NB: `workflow_run` only ever runs the copy of this file on the default branch. A
# change here is inert until it lands there — including while its own PR is open.
#
# THIS FILE IS VENDORED from devkit (`sync-devkit.py`'s MANIFEST) and is byte-identical
# in every project. That is only possible because nothing in it is project-specific:
# `on.pull_request` carries no `branches:` filter (the classify job is already
# restricted to Dependabot's own PRs, so narrowing by branch would only add a name that
# differs per repo), and the workflow it waits on is titled `PR Gate` everywhere. Keep
# it that way — a local edit here is reported as drift by the PR gate rather than
# quietly becoming one project's private opinion.

on:
  pull_request:
    # The default three, for classify and for a resolver's push reaching the drain;
    # `labeled` for the drain, the label being what a PR opened with it arrives by; and
    # `ready_for_review`, or a draft marked ready would wait for the hourly pass.
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]
  schedule:
    # The retry pass. Hourly rather than daily because the thing it recovers from is a
    # transient outage, and an update that merges an hour late is fine while one that
    # waits until tomorrow has already cost a day of the window it was opened in.
    - cron: "17 * * * *"
  workflow_dispatch:

# Dependabot-triggered runs get a read-only token unless the workflow asks for more
# explicitly, here. `issues: write` is for the labels, not for issues: labels live on
# the issues API, and `gh pr edit --add-label` fails outright on a label the repo does
# not have yet — which is every repo on its first Dependabot PR.
permissions:
  # `actions: write` is the merge's: a merge made with this token raises no `push`, so it
  # dispatches `PR Gate` itself. Reading is the sweep's: it asks the runs API whether
  # `PR Gate` succeeded on a PR's current head SHA, which is the same evidence the merge
  # job gets handed by its triggering event and has to go and find on a schedule.
  actions: write
  # `checks: read` is the sweep's too, and for the half of its evidence the runs API does
  # not hold: `blocking_checks` asks `commits/{sha}/check-runs` whether anything *else*
  # wired onto the PR is unfinished or red. A `permissions:` block grants only what it
  # lists, so omitting this scope did not degrade the sweep -- it made every pass that
  # reached a candidate PR die on `HTTP 403: Resource not accessible by integration`,
  # which is the retry for stranded merges never running at all.
  checks: read
  contents: write
  issues: write
  pull-requests: write

# This file carried NO concurrency block for most of its life, deliberately: its merge job
# is driven by `workflow_run` completions, and two gate completions on two branches are
# independent work that a shared group would drop one half of. The schedule made a group
# mandatory, so the key is built to preserve that -- per commit for a `workflow_run`, and
# `github.run_id` (unique per run) for anything without one, so a scheduled pass and a
# dispatch each get a group of their own and can never supersede a real completion. Per
# commit rather than per branch because merges now gate one commit each on the default
# branch: GitHub keeps one pending run per group, and a failed gate's run replacing a
# passing one's would leave `green` behind a commit that passed.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Label for automerge
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Label the Dependabot PR automerge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately does not check out the repo — it needs no files.
          # But `gh` falls back to reading the repo from `git remote` when it is not
          # told one, so without GH_REPO every call here dies on "fatal: not a git
          # repository" before it does any work.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `--force` makes this idempotent AND makes the workflow work on a repo
          # that has never carried the label. Without it the first Dependabot PR
          # fails here, on a missing label, not on anything real.
          # The colour and description match `sweep.LABEL_SPECS` exactly: both
          # sides create with `--force`, so two spellings would flip the label
          # back and forth per run.
          gh label create automerge --color 0e8a16 --force \
            --description "PR the harness may merge once the gate passes"
          gh pr edit "$PR_URL" --add-label automerge

  merge:
    name: Merge if PR Gate passed
    # No author condition, on either the run's actor or the PR: the label is the
    # whole authorization, and only write access can apply it. A fork PR cannot be
    # labelled by its author, and `gh pr list --head` below matches same-repo
    # branches only, so an unlabelled or external PR falls out before the merge.
    # A `workflow_dispatch` completion counts: a lock repair pushes with GITHUB_TOKEN,
    # which raises no usable `pull_request` event, and dispatches the gate on the PR's
    # branch instead. The script accepts that run only on the PR's own head branch.
    # A `push` completion is the default branch's own gate: its move is what left every
    # open PR's mergeability undecided, so the script sweeps them all (`DEFAULT_BRANCH`).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "workflow_dispatch", "push"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Merge the auto-mergeable PR for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The workflow_run event carries a BRANCH, not a PR, so the script re-derives
          # the PR and re-checks every guard from scratch. Passing the gated SHA is what
          # stops a human push to a `dependabot/` branch from inheriting this merge: the
          # head has moved by then, and a mismatch declines.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The runner's own Python and no install step, for the same reason the failure
        # reporter uses it: the script is stdlib-only, and a merge that had to be
        # provisioned first would fail whenever provisioning does.
        run: python scripts/merge-dependabot-prs.py

  sweep:
    name: Drain the merge queue
    # Everything the event-driven job dropped. It fires once per gate completion and
    # nothing re-runs it, so a single transient failure -- an API outage, a rate limit, a
    # cancelled run -- strands an already-approved bump permanently. It is also the
    # direct flow's merger, started by a PR arriving with `merge-now`.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'merge-now'))
    runs-on: ubuntu-latest
    # One drain at a time in a repository is what makes merging sequential there, and
    # projects run in parallel because a group belongs to its repository.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    outputs:
      tidy: ${{ steps.drain.outputs.tidy }}
      branch: ${{ steps.drain.outputs.branch }}
      python: ${{ steps.drain.outputs.python }}
    steps:
      # The default branch, never the event's ref: on `pull_request` that is the PR's own
      # tree, and this job runs what it checks out with a token that can merge.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Merge every cleared PR still sitting open
        id: drain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MERGE_QUEUE: "yes"
        run: python scripts/merge-dependabot-prs.py

  tidy:
    name: Tidy, then gate what landed
    needs: sweep
    # `!cancelled()`, because a drain that merged two PRs and had a third refused ends red
    # and the implied `success()` would then leave what landed with no tidy and no gate.
    if: ${{ !cancelled() && needs.sweep.outputs.tidy == 'true' }}
    runs-on: ubuntu-latest
    # Apart from the drain's group, or merging would wait on a formatter.
    concurrency:
      group: tidy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sweep.outputs.branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ needs.sweep.outputs.python }}
      - name: Format, reconcile and mirror
        env:
          TIDY_BRANCH: ${{ needs.sweep.outputs.branch }}
        run: uv run python scripts/tidy-main.py
      - name: Start the gate on the tip
        # Whatever tidying managed: an untidy tip with a verdict beats a tip with none.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GATE_ONLY: ${{ needs.sweep.outputs.branch }}
        run: python scripts/merge-dependabot-prs.py

  green:
    name: Advance green
    # A commit of the default branch only: `head_branch` alone would also match a fork's
    # branch of the same name, whose run arrives as a `pull_request`.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fast-forward green to the commit that passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/green-ref.py
