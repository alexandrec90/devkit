# Per-project config for the shared agent-harness hook scripts (scripts/hooks/*.py).
# The scripts are vendored unchanged across projects; everything project-specific lives
# here. Loaded by scripts/hooks/harness_config.py. Schema + neutral defaults: that
# module's dataclasses.
#
# THIS IS DEVKIT'S OWN MANIFEST, describing devkit. It previously held a copy of
# carameli's — env_prefix = "CARAMELI", an `app/` tree, a Postgres+Redis tier, a
# frontend — none of which exist in this repo. As a documented example that was
# harmless; as configuration it is not, because devkit now runs these hooks on itself,
# and a hook reading another project's shape acts on directories that are not here. The
# canonical example lives where a template belongs:
# templates/core/dot-devkit.toml.tmpl.

[project]
# Prefix for harness control env vars:
#   DEVKIT_SKIP_STOP_VERIFY, DEVKIT_STOP_TESTS_AUTOSTART
env_prefix = "DEVKIT"

[paths]
# devkit's "application code" is the scripts themselves: the generator, the port
# registry, the renderer, the sweep tool, and the hook scripts it vendors out. A change
# anywhere under scripts/ can break the generator, so it runs the whole suite.
app = "scripts/"
tests = "tests/"
# devkit's suite is flat — no unit/integration split — so the "whole unit suite" target
# that an app-code change selects is the suite itself.
unit_tests = "tests"

# The interpreter, matching `requires-python` in pyproject.toml. devkit runs its own
# harness, so this is also the field's first consumer: without it `worktree.py provision`
# builds a box's .venv from whatever Python is running the provisioner, which on this
# workstation is a newer release than the floor devkit's syntax is tested against.
[python]
version = "3.12"

# The PreToolUse Bash output cap, wired in .claude/settings.json. devkit takes the
# defaults; they are stated explicitly rather than omitted so that this file documents
# the tier it runs, and so a change to the neutral default in harness_config.py shows up
# here as a diff rather than silently moving devkit's own cap.
[bash]
max_bytes = 4000
head_bytes = 2000

[db]
# No database, and no Docker stack at all: devkit is stdlib-only Python plus templates,
# which is what lets its CI run with no service containers. With this false the Stop
# hook's Tier 2b runs `tests/` directly on the host (see `run_host_tests`) instead of
# skipping the tier — the DB flag gates *infra*, not whether tests run.
enabled = false

[frontend]
enabled = false
