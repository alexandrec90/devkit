# The hooks devkit publishes. A consuming project pins them by rev:
#
#   repos:
#     - repo: https://github.com/alexandrec90/devkit
#       rev: v0.5.0
#       hooks:
#         - id: devkit-manifest
#         - id: devkit-hooks-stdlib-only
#         - id: devkit-drift
#
# `language: script`, not `language: python`: devkit is a virtual project
# (`[tool.uv] package = false`) with nothing to install, and these scripts are stdlib-only
# by contract — so pre-commit's clone is already everything they need. That also keeps the
# hooks usable from a repo that has no Python environment of its own yet.
#
# NB: `rev` is the whole point of this channel. The vendored tier needs `$DEVKIT_DIR` to
# point at a local clone and can only refuse when it does not; here the version is written
# down in the consumer's config and moved by `pre-commit autoupdate`, so a machine that has
# never cloned devkit still gets the check.

- id: devkit-manifest
  name: validate .devkit.toml
  description: >-
    Fail on a manifest the harness would silently ignore — unparseable TOML, a path
    prefix missing its trailing slash, a declared directory that does not exist in this
    repo, or a [db]/[frontend] block switched on but left half-filled.
  entry: scripts/precommit/check_harness_manifest.py
  language: script
  files: (^|/)\.devkit\.toml$

- id: devkit-hooks-stdlib-only
  name: harness hooks import stdlib only
  description: >-
    Hook scripts run before the virtualenv exists, so a third-party import there fails at
    hook time rather than at test time. Rejects any absolute import that is neither
    stdlib nor a first-party sibling.
  entry: scripts/precommit/check_stdlib_only.py
  language: script
  files: ^scripts/hooks/.*\.py$
  # Test files import pytest by definition.
  exclude: ^scripts/hooks/tests/

- id: devkit-drift
  name: vendored harness matches the pinned devkit rev
  description: >-
    Byte-compares every file in sync-devkit.py's MANIFEST against the devkit revision
    this config pins. Unlike `sync-devkit.py --check` it needs no DEVKIT_DIR, so
    it cannot degrade into a gate that checks nothing.
  entry: scripts/precommit/check_harness_drift.py
  language: script
  # The manifest decides what is compared, not the staged file list.
  pass_filenames: false
  always_run: true
