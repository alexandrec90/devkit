# Host-port registry — the single source of truth for which local ports each
# project's Docker stack publishes.
#
# WHY THIS EXISTS. Every project here publishes its stack on host ports, and every
# project can have a parallel `git worktree` running a *second* stack at the same
# time. Nothing coordinated those numbers: they lived in each repo's README prose
# and in gitignored `.env` files, so they drifted. Carameli's README prescribes
# `DB_HOST_PORT=5433` for the `-b` worktree while the real `.env` uses `5434`, and
# ibkr_trader hardcodes `5433` in its compose file — anyone following the README
# to the letter would have collided the two stacks.
#
# THE MODEL. Each checkout (a project, or one of its worktrees) owns one integer
# **slot**. Every published port is `base + slot`, where `base` is the service's
# conventional port. Slot 0 therefore gets the familiar defaults (Postgres 5432,
# Vite 5173), and every other checkout is a uniform offset from them — one number
# to look up per checkout instead of one per service.
#
# `scripts/devkit_ports.py` reads this file, and `scripts/new-project.py` renders
# each new project's `.env` from it. Adding a project means adding a slot here.
#
# NOT EVERY SLOT IS PINNED HERE. `[slots]` is the static tier: one permanent number
# per long-lived checkout, maintained by hand. An ephemeral box (`scripts/worktree.py`)
# LEASES a slot for as long as it exists and releases it on reap, recorded in
# `<workspace>/.worktrees/leases.json` rather than in this file — a per-task checkout
# would otherwise spend a permanent number on work that lasts an afternoon. Both claim
# sets are unioned when a lease is handed out, so the two tiers cannot collide;
# `registry.max_slots` is the ceiling across both.

[registry]
# Slot ceiling. Also the minimum spacing enforced between any two service bases:
# with bases <max_slots apart, a high slot of one service would land on a low slot
# of another (minio 9000 + slot 1 == a console base of 9001 + slot 0). `validate()`
# fails the file rather than let that ship.
max_slots = 16

[services]
# service -> conventional host port for slot 0. Keep every pair >= max_slots apart.
app = 8000
frontend = 5173
db = 5432
redis = 6379
minio = 9000
minio_console = 9040
grafana = 3000
prometheus = 9090

[shared]
# Workspace **singletons**: one process serves every checkout, so the port is fixed
# rather than offset by slot. `validate()` keeps these clear of every `[services]`
# base's slot range, so a singleton can never land on a per-checkout stack's port.
#
# WHY THIS TABLE EXISTS. `otel_http` was a `[services]` base until 2026-08-17, which
# gave every project its own agent-telemetry endpoint: carameli 4318 (slot 0),
# sports_betting 4322 (slot 4), apt-finder 4324 (slot 6). Only carameli ever ran a
# collector, so the other two exported into a closed port for a month -- and an OTLP
# exporter that cannot connect retries in the background forever, so nothing ever
# said so. The slot model was simply the wrong shape for this one: Claude Code's
# telemetry is about the *agent*, which is one program driving every checkout in the
# workspace, not about the stack a checkout happens to publish.
#
# One collector, one port, `service.name` in OTEL_RESOURCE_ATTRIBUTES telling the
# senders apart. The collector itself lives in carameli's `monitoring` compose
# profile, where its Prometheus and Grafana consumers already are.
otel_http = 4318

[slots]
# checkout directory name -> slot. The directory name is also the value of
# COMPOSE_PROJECT_NAME in that checkout, which is what namespaces its volumes,
# network, and containers — keep the two identical.
#
# Backfilled against what each stack actually publishes today, so adopting the
# registry required renumbering nothing that was already running:
#
#   carameli      slot 0 -> db 5432   matches its stack exactly
#   ibkr_trader   slot 1 -> db 5433   matches the port pinned in its compose file
#   (the `-b` checkouts held slots 2, 3, 5 and 7 until the ephemeral-box tier replaced
#   them. Four permanent numbers spent on a second checkout per repo is exactly what a
#   LEASE is for, and freeing them raised the concurrent-box ceiling from 8 to 12.)
#
# Only checkouts that publish something are listed. A stackless repo — devkit,
# data-lake — has no slot on purpose, and `slot_of` raising for it is the right
# answer rather than a gap to backfill.
carameli = 0
ibkr_trader = 1
sports_betting = 4
apt-finder = 6
