# `devkit.localE2e` assigns every project's local tier but tvshell's to desktop-b9fc8vp, and
# no other PC can see whether it runs: the results there are the only record.
on = "desktop-b9fc8vp"
agent = """
Check that this PC really runs the local end-to-end tier. Read the hostname first: on any
host but desktop-b9fc8vp there is nothing to judge here, so say in the intent which host
took this task and that desktop-b9fc8vp never did, and file that with
`python scripts/hooks/report-harness-defect.py` if the script is there.

On desktop-b9fc8vp: bring the devkit checkout to origin/green if it is behind and clean,
run `python scripts/installers.py maintain`, and confirm `devkit-local-e2e`,
`devkit-fix-trigger` and `devkit-fix-pass` are registered and enabled (`schtasks /Query`).
Then `python scripts/e2e-pass.py status`: every project the workspace file's
`devkit.localE2e` assigns this PC should have a result from the last few days. For one that
has none, or only an old one, find out why in logs/scheduled-local-e2e.log and fix the cause
if it is devkit's. Check too that the workspace file here says `"devkit.fixPass":
"dispatch"`: a red on a PC that does not dispatch reaches no fixer.

Finished means the intent says, per assigned project, when it last ran and what it said.
Change no project's code and delete nothing.
"""
