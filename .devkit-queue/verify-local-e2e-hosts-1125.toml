# `devkit.localE2e` assigns every project's local tier but tvshell's to desktop-900mt6f
# (moved off desktop-b9fc8vp, offline for weeks), and no other PC can see whether it runs:
# the results there are the only record.
on = "desktop-900mt6f"
agent = """
Check that this PC really runs the local end-to-end tier. Read the hostname first: on any
host but desktop-900mt6f there is nothing to judge here, so say in the intent which host
took this task and that desktop-900mt6f never did, and file that with
`python scripts/hooks/report-harness-defect.py` if the script is there.

On desktop-900mt6f: bring the devkit checkout to origin/green if it is behind and clean,
run `python scripts/installers.py maintain`, and confirm `devkit-local-e2e`,
`devkit-fix-trigger` and `devkit-fix-pass` are registered and enabled (`schtasks /Query`).
Then `python scripts/e2e-pass.py status`: every project `projects.toml`'s
`devkit.localE2e` assigns this PC should have a result from the last few days. For one that
has none, or only an old one, find out why in logs/scheduled-local-e2e.log and fix the cause
if it is devkit's. Check too that this PC's switch says `"devkit.fixPass": "dispatch"` --
`.devkit-machine.json` beside the checkouts, or the workspace file where that file does not
set it (`python scripts/machine_role.py --migrate` moves it): a red on a PC that does not
dispatch reaches no fixer. The assignment moved
here recently, so a project with no result yet may simply not have had a night: say which.

Finished means the intent says, per assigned project, when it last ran and what it said.
Change no project's code and delete nothing.
"""
