# Ledger group f85fb32a: a declared dashboard whose frontend needs a newer Node than the
# PC has can never wake, and nothing in devkit says so or fixes it.
when = "merged"
on = "any"
agent = """
In devkit (this checkout), make a declared dashboard's Node requirement something the
harness provisions or reports, never a silent 503.

What was seen (2026-11-27, desktop-ml5f3pj): ibkr_trader's dashboard entry in
`projects.toml` `[settings."devkit.dashboards"]` runs `scripts/ui-task.py --port {port}
--no-open`. The only Node on that PC is 18.15 (winget `OpenJS.NodeJS.18`), while
ibkr_trader's `frontend/package.json` declares `engines.node` `>=24`, so `npm run build`
fails (`node:util` has no `styleText`) and the gateway in `scripts/dashboards.py` answers
503 forever. No `frontend/dist` was ever built there.

Do this:
1. Find where devkit provisions a checkout's toolchain (`scripts/worktree.py provision`,
   the `[python] version` / `uv venv --python` seam described in `scripts/CLAUDE.md`)
   and add the Node half: read `engines.node` from the project's `frontend/package.json`
   (and `.nvmrc` / `.node-version` if present) and, where the machine's `node` does not
   satisfy it, fetch a per-user Node of a satisfying version (as `uv` does for Python),
   not a machine-wide upgrade.
2. In `scripts/dashboards.py`, when a backend's wake fails, record the cause the build
   printed in the gateway state and log, so a 503 names `node <have> < <need>` instead of
   nothing.
3. Tests for both in the same change (`tests/test_dashboards.py`, the provisioner's tests).

Finished looks like: on a PC with only Node 18, provisioning ibkr_trader yields a Node
that satisfies `>=24` for its dashboard build, and a wake that still fails says why.
"""
