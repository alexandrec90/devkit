# The tray's replacement, on every PC, now rather than at the next logon:
#
# - `installers.py maintain` deletes the retired `devkit-tray` task (`installers.RETIRED`),
#   which with `tray.py` gone would fail at every logon until the daily pass ran;
# - the gateway reads `devkit.dashboards` only as it starts, so ending and re-running
#   `devkit-dashboards` is what serves devkit's dashboard on 127.0.0.1:8790. Every other
#   dashboard sleeps with it and wakes on its next request, as after an idle spell.
#
# `&`, not `&&`: `/End` fails on a gateway that is not running, and that is no reason to
# skip `/Run`, whose exit is the task's.
on = "every-machine"
when = "merged"
run = "python scripts/installers.py maintain & schtasks /End /TN devkit-dashboards & schtasks /Run /TN devkit-dashboards"
