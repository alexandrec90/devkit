globs:
  - "**/*.md"
  - ".claude/**/*.md"

ignores:
  # `globs` above is absolute, not "whatever pre-commit staged", so this linter sees
  # every .md in the tree including the git-ignored ones. `logs/` is the failure-artifact
  # directory: everything in it is generated, none of it is reviewed as prose, and it is
  # not in git — so a report written there could fail the commit of the code that wrote
  # it. Nothing wrote a .md there until `workspace-task-index.py --format markdown` did.
  - "logs/**"
  - ".agents/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/.pytest_cache/**"

config:
  default: true
  # Prose is wrapped for readability, but tables, links, and code may exceed the
  # source-width convention without becoming harder to read.
  MD013: false
  # Repeating a section name under separate parents is useful in long references.
  MD024:
    siblings_only: true
