# This file is the project's own. It arrives once from devkit's `templates/` and is
# never vendored — `sync-devkit.py --check` does not compare it — so editing it is the
# supported way to change how this project installs. devkit tried vendoring it in
# v0.7.0 and two consumers broke on the first pull that reached them; see `MANIFEST` in
# `scripts/sync-devkit.py` for that history, and the sync step below for what it means
# in practice.
name: Set up the Python toolchain
description: >-
  Install Python and uv, then sync the project from its committed uv.lock. The
  repository must already be checked out — a local composite action is loaded from
  the workspace — so callers keep their own actions/checkout step, whose arguments
  (ref, fetch-depth) differ per job.

inputs:
  python-version:
    description: >-
      Python version to install. The default is a floor, not this project's version —
      devkit's `templates/` copy is copied verbatim rather than rendered (it is held
      byte-identical to devkit's own by `test_setup_action_template_matches_devkits`),
      so no project's `python_version` is ever substituted into it. A generated
      project's gate passes its own version explicitly at every call site for exactly
      that reason; a project that moves off 3.12 and relies on the default here would
      provision the wrong interpreter without failing.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      shell: bash
      run: pip install uv
    - name: Sync the project from uv.lock
      # The same command `.claude/hooks/session-start.sh` runs, against the same
      # committed lock — so a job provisions the way a session does, and a lock that
      # cannot resolve fails here rather than in someone's sandbox.
      #
      # Both flags, always. They are each a no-op in one of the two shapes devkit
      # generates: devkit declares a PEP 735 `dev` dependency-group and no extras, a
      # generated project declares a `dev` extra and no groups. Passing both covers
      # both. mypy comes along either way, which matters — devkit's own `lint-all.py`
      # skips linters it cannot import, so omitting it would silently drop
      # type-checking rather than fail.
      #
      # That is a starting point, not a contract. A project that installs some other
      # way — pip-tools locks through `uv pip install --system`, a sibling repo cloned
      # first for an editable path dependency, extras CI cannot install — rewrites
      # these steps in place, and nothing upstream will report it. Which is why there
      # is no `sync-args` input: it would parameterise the arguments while fixing the
      # shape, and the shape is the part that actually varies.
      shell: bash
      run: uv sync --all-extras --all-groups
