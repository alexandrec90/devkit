[project]
name = "devkit"
version = "0.1.0"
description = "A portable agent-coding harness for Claude Code / Codex, and the project generator that ships it."
requires-python = ">=3.12"
# Deliberately empty. Everything devkit ships — the hook scripts, the generator, the
# port registry, the renderer — is **stdlib only**, and that is a contract, not an
# accident: hooks run before any virtualenv is active, so a third-party import here
# would break provisioning on the very sessions the harness exists to set up.
dependencies = []

[dependency-groups]
# The host toolchain, in a PEP 735 dependency-group rather than an optional-dependency
# extra: extras belong to a *distribution*, and devkit is not one (see [tool.uv] below).
# `uv sync --all-groups` — what `.claude/hooks/session-start.sh` runs — installs this.
dev = [
  "ruff>=0.16.4",
  "mypy>=2.3.1",
  "pytest>=8.3",
  # devkit publishes pre-commit hooks (.pre-commit-hooks.yaml) and runs them on itself
  # (.pre-commit-config.yaml), so the runner is part of the host toolchain. It also
  # brings PyYAML, which the tests covering those config files parse with.
  "pre-commit>=4.6.2",
]

[tool.uv]
# devkit is a **virtual project**: a repo of scripts and templates, not an installable
# package. Without this, `uv sync` tries to build a wheel, finds no package to put in
# it, and fails — which is what would happen on every remote session, since
# `session-start.sh` takes the `uv.lock` branch first.
package = false

[tool.pytest.ini_options]
# devkit's own suite only. `scripts/hooks/tests/` is the vendored tier — it ships into
# every consuming project and runs as its own step (in CI, in the Stop hook, and as its
# own VS Code task), so keeping it out of `testpaths` is what makes the two trees
# separately runnable. This mirrors the `testpaths` every generated project gets.
testpaths = ["tests"]
addopts = '-q -m "not paid"'
markers = [
  "claude_live: paid opt-in smoke tests that launch an authenticated Claude Code CLI session",
  "codex_live: paid opt-in smoke tests that launch an authenticated Codex CLI session",
  "paid: tests that may consume paid live infrastructure and are excluded by default",
]

[tool.mypy]
python_version = "3.12"
# Match tests/support.py's runtime path setup so its typed module re-exports resolve.
#
# `scripts/precommit` is here for a scope reason rather than a re-export one: three
# scripts load the shared `_loader` through a sys.path insert, and a WHOLE-REPO run
# resolves it by happening to check that directory too. `lint-all.py --changed` passes
# only the changed files, so the same import became "Cannot find implementation or
# library stub" -- a gate that failed on exactly the files that had been edited, which
# is every time it matters.
mypy_path = ["scripts", "scripts/hooks", "scripts/precommit"]
warn_unused_ignores = true
warn_redundant_casts = true
# NB: no `exclude` for `scripts/hooks/`. Every generated project excludes the vendored
# harness because `sync-devkit.py --check` forbids it from editing those files, so
# reporting type errors there would hand its agent findings it cannot act on. devkit is
# upstream — these files are the ones it is allowed and expected to fix, so they are in
# scope here. `templates/` stays out: `.tmpl` files are not valid Python until rendered.
exclude = '^templates/'
